<!doctype html><html><head><meta charset="utf-8"><title>Gfx textures</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px sans-serif}.g{display:flex;flex-wrap:wrap;gap:6px;padding:6px}.t{display:flex;flex-direction:column;align-items:center}canvas{width:150px;height:150px;image-rendering:auto}</style></head>
<body><div class="g" id="g"></div>
<script src="../vendor/three.min.js"></script><script src="../src/gfx.js"></script>
<script>
// Shows each texture's colour map tiled 2x2 (to check seams) and its normal map (?normal=1)
const q = new URLSearchParams(location.search); const showN = q.get('normal');
const names = (q.get('names') || '').split(',').filter(Boolean); const list = names.length ? names : PF.Gfx.Textures.names();
let total = 0;
for (const n of list) {
  const s = PF.Gfx.Textures.get(n); total += s.ms;
  const d = document.createElement('div'); d.className = 't'; const c = document.createElement('canvas'); c.width = c.height = 300; const ctx = c.getContext('2d');
  let src = s.map && s.map.image;
  if (showN || !src) { const img = s.normalMap.image; const cv = document.createElement('canvas'); cv.width = cv.height = img.width; const id = cv.getContext('2d').createImageData(img.width, img.height); for (let i = 0; i < img.data.length; i += 4) { id.data[i] = img.data[i]; id.data[i + 1] = img.data[i + 1]; id.data[i + 2] = img.data[i + 2]; id.data[i + 3] = 255; } cv.getContext('2d').putImageData(id, 0, 0); src = cv; }
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) ctx.drawImage(src, x * 150, y * 150, 150, 150);
  d.appendChild(c); const l = document.createElement('div'); l.textContent = n + ' ' + s.ms.toFixed(0) + 'ms'; d.appendChild(l); document.getElementById('g').appendChild(d);
}
console.log('GFX textures total ms', total.toFixed(0));
window.__ready = true;
</script></body></html>
